name = "wxhook"
main = "src/index.js"
compatibility_date = "2026-04-14"

[ai]
binding = "AI"

[[queues.producers]]
queue = "webhook-queue"
binding = "WEBHOOK_QUEUE"

[[queues.consumers]]
queue = "webhook-queue"
max_batch_size = 5
max_batch_timeout = 2

[observability]
enabled = true

[vars]
# WXPUSHER = '[{"APP_TOKEN":"AT_xxxxxx", "UIDS":"UID_xxxxxx", "TOKEN":"xxxxxx"}]'
# TELEGRAM = '[{"BOT_TOKEN":"1234567890:xxxxxx", "CHAT_ID":"1234567890", "TOKEN":"xxxxxx"}]'
# PUSHME = '[{"PUSH_KEY":"xxxxxx", "TOKEN":"xxxxxx"}]'


# 自定义域名
# workers_dev = false
# preview_urls = false
